name: 랭킹 누락 장애 진단/복구 (수동)

# 2026-08 장애 대응 — startSession 실패로 점수가 NO_SESSION → 보류로 빠져
# 랭킹·주간랭킹에 반영되지 않는 문제를 진단하고, 보류된 정상 기록을 되살린다.
#
# 기본값은 inspect(읽기 전용). 실제 반영은 mode 를 apply 로 골라야 한다.
# ⚠️ 이 저장소는 공개라 실행 로그도 공개된다 — 스크립트가 닉네임·UID를 마스킹한다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        type: choice
        options: [inspect, apply, apply-week]
        default: inspect
        required: true
      limit:
        description: '조회할 보류 세션 수 (최근순)'
        default: '300'
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: oing-game
      REGION: asia-northeast3
      GOOGLE_CLOUD_QUOTA_PROJECT: oing-game
      MODE: ${{ inputs.mode }}
      LIMIT: ${{ inputs.limit }}
    steps:
      # workflow_dispatch 는 임의 브랜치로 실행할 수 있어 main 으로 고정한다.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin@12

      # 503("service not available yet")이 나올 때 실제 배포 상태를 확인한다.
      # 읽기 전용 조회이며, 권한이 없으면 조용히 넘어간다(진단이 목적이라 실패해도 무방).
      - name: Cloud Functions / Cloud Run 상태 조회 (읽기 전용)
        continue-on-error: true
        run: |
          echo "── Cloud Functions (gen1+gen2) ──"
          gcloud functions list --project oing-game --regions "$REGION" \
            --format="table(name,state,environment,updateTime)" 2>&1 | head -40 || true
          echo
          echo "── Cloud Run 서비스 (gen2 함수의 실체) ──"
          gcloud run services list --project oing-game --region "$REGION" \
            --format="table(metadata.name,status.conditions[0].type,status.conditions[0].status,status.conditions[0].message)" 2>&1 | head -40 || true
          echo
          echo "── Cloud Functions 리소스 상태 (cloudfunctions.net 라우팅의 근거) ──"
          gcloud functions describe startSession --project oing-game --region "$REGION" --gen2 \
            --format="yaml(name,state,environment,serviceConfig.uri,serviceConfig.service,updateTime)" 2>&1 | head -30 || true
          echo
          echo "── 직통 run.app URL (있으면 클라에서 이쪽을 부를 수 있음) ──"
          for S in startsession submitscore adminrecoverscore adminapprovescore; do
            U=$(gcloud run services describe "$S" --project oing-game --region "$REGION" \
                  --format="value(status.url)" 2>/dev/null || true)
            echo "  $S -> ${U:-(조회 실패)}"
            if [ -n "$U" ]; then
              # 인증 없이 호출 → 401/permission-denied 등 '앱 레벨' 응답이면 라우팅은 살아있다는 뜻
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 15 -X POST "$U" \
                       -H 'Content-Type: application/json' -d '{"data":{}}' || echo "000")
              echo "     직통 호출 HTTP $CODE"
            fi
          done

      # startSession·submitScore 만 컨테이너 기동 실패(503). 다른 함수는 앱까지 도달(500).
      # 마지막 배포(2026-08-08T17:18Z) 직후부터라 그 배포가 원인으로 보인다.
      # 롤백 대상을 찾기 위해 리비전 이력과 기동 실패 로그를 본다. 읽기 전용.
      - name: 기동 실패 원인·롤백 후보 조회 (읽기 전용)
        continue-on-error: true
        run: |
          for S in startsession submitscore; do
            echo "════════ $S 리비전 이력 ════════"
            gcloud run revisions list --project oing-game --region "$REGION" --service "$S" \
              --format="table(metadata.name,metadata.creationTimestamp,status.conditions[0].status)" \
              --sort-by="~metadata.creationTimestamp" --limit 6 2>&1 | head -20 || true
            echo
            echo "──── $S 현재 트래픽 ────"
            gcloud run services describe "$S" --project oing-game --region "$REGION" \
              --format="value(status.traffic)" 2>&1 | head -5 || true
            echo
            echo "──── $S 최근 오류 로그 (기동 실패 사유) ────"
            gcloud logging read \
              "resource.type=cloud_run_revision AND resource.labels.service_name=$S AND severity>=ERROR" \
              --project oing-game --limit 8 --format="value(timestamp,textPayload,jsonPayload.message)" 2>&1 | head -30 || true
            echo
          done

      # Cloud Run 기동 실패 사유가 "billing is disabled for this project" 였다.
      # 결제 연결 상태를 직접 확인한다(읽기 전용). 계정 ID는 공개 로그라 일부만 노출.
      - name: 결제(billing) 상태 조회 (읽기 전용)
        continue-on-error: true
        run: |
          echo "── 프로젝트 결제 연결 상태 ──"
          gcloud billing projects describe oing-game \
            --format="value(billingEnabled,billingAccountName)" 2>&1 | head -5 \
            | sed -E 's#(billingAccounts/[0-9A-Z]{6})[0-9A-Z-]*#\1…(마스킹)#' || true
          echo
          echo "── 이 자격증명으로 보이는 결제 계정 ──"
          gcloud billing accounts list --format="value(name,open,displayName)" 2>&1 | head -5 \
            | sed -E 's#(billingAccounts/[0-9A-Z]{6})[0-9A-Z-]*#\1…(마스킹)#' || true
          echo
          echo "※ billingEnabled=False 이면 결제가 끊긴 것이고, 콘솔에서 결제수단을"
          echo "  갱신·재연결해야 한다. 서비스 계정 권한으로는 결제 재연결이 불가능하다."

      - name: Run
        run: node test/session-outage-tool.mjs
